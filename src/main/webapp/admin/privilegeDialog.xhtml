<ui:composition
    template="/jmts-ui/templates/jmts-dialog.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:p="http://primefaces.org/ui"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"   
    xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="head">
        <title>Privilege</title>
    </ui:define>

    <ui:define name="content">
        
        <ui:include src="../common/commonDialogs.xhtml"/>

        <h:form id="privilegeDialogForm">    

            <p:growl id="privilege_growl" life="5000" showDetail="true"/>

            <ui:include src="privilegeDialogToolbar.xhtml" /> 

            <p:panel style="margin-bottom: 1px;margin-top: 1px;">
                <h:panelGrid columns="2" cellpadding="5" style="width: 100%;">

                    <p:outputLabel value="Active *"                                    
                                   for="activePrivilege" 
                                   style="font-weight: bold;" /> 
                    <p:selectBooleanCheckbox id="activePrivilege" 
                                             value="#{systemManager.selectedPrivilege.active}" />                    

                    <p:outputLabel value="Name" for="privilegeName" style="font-weight: bold;"/>
                    <p:inputText id="privilegeName"
                                 value="#{systemManager.selectedPrivilege.name}" 
                                 required="true"
                                 requiredMessage="Name Required"
                                 validator="nameFieldValidator" >       

                        <p:ajax event="change"                                                       
                                process="@this"/>

                    </p:inputText>

                    <p:outputLabel value="Description" for="description" style="font-weight: bold;"/>       
                    <p:inputText id="description"
                                 value="#{systemManager.selectedPrivilege.description}"
                                 required="true"
                                 requiredMessage="Description Required"
                                 validator="requiredFieldValidator" >       

                        <p:ajax event="change"                                                       
                                process="@this"/>

                    </p:inputText>                    
                </h:panelGrid>
            </p:panel>

            <ui:include src="privilegeDialogToolbar.xhtml" /> 

        </h:form> 

    </ui:define>
</ui:composition>
