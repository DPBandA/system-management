<ui:composition
    template="/jmts-ui/templates/jmts-dialog.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:p="http://primefaces.org/ui"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"   
    xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="head">
        <title>Category</title>
    </ui:define>

    <ui:define name="content">
        
        <ui:include src="../common/commonDialogs.xhtml"/>

        <h:form id="categoryDialogForm">    

            <p:growl id="category_growl" life="5000" showDetail="true"/>

            <ui:include src="categoryDialogToolbar.xhtml" /> 

            <p:panel style="margin-bottom: 1px;margin-top: 1px;">
                <h:panelGrid columns="2"  cellpadding="5" >
                    <p:outputLabel value="Active *"                                    
                                   for="active" 
                                   style="font-weight: bold;" /> 
                    <p:selectBooleanCheckbox id="active" 
                                             value="#{systemManager.selectedCategory.active}" /> 

                    <p:outputLabel value="Name" for="category" style="font-weight: bold;"/>
                    <p:inputText id="category"
                                 value="#{systemManager.selectedCategory.name}" 
                                 required="true"
                                 requiredMessage="Name Required" >  

                        <f:validator validatorId="nameFieldValidator" />

                        <p:ajax event="change"                                                       
                                process="@this"/>

                    </p:inputText>

                    <p:outputLabel value="Type" for="type" style="font-weight: bold;"/>
                    <p:inputText id="type"
                                 value="#{systemManager.selectedCategory.type}"
                                 required="true"
                                 requiredMessage="Type Required"
                                 validator="requiredFieldValidator" >

                        <p:ajax event="change"                                                       
                                process="@this"/>

                    </p:inputText>

                    <p:outputLabel value="Description" 
                                   for="description"
                                   style="font-weight: bold;" />
                    <p:inputTextarea  value="#{systemManager.selectedCategory.description}"
                                      style="width: 125%;"
                                      id="description"
                                      maxlength="1000"
                                      rows="4"
                                      required="true"
                                      requiredMessage="Description Required"
                                      validator="requiredFieldValidator"
                                      autoResize="false" >

                        <p:ajax event="change"                                                       
                                process="@this"/>

                    </p:inputTextarea>
                </h:panelGrid>
            </p:panel>

            <ui:include src="categoryDialogToolbar.xhtml" /> 

        </h:form> 

    </ui:define>
</ui:composition>
